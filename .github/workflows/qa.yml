name: Website QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: Inspect website before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm test

      - name: Check whitespace and encoding regressions
        shell: bash
        run: |
          git diff --check
          ! grep -R -n -E 'ðŸ|â€”|Â©' --include='*.html' .

      - name: Check approved external destinations
        shell: bash
        run: |
          for url in \
            "https://meaningfulideas.newzenler.com/fp/guiding-without-controlling-free-course" \
            "https://meaningfulideas.newzenler.com/courses/meaningful-ideas-membership" \
            "https://meaningfulideas.newzenler.com/support" \
            "https://meaningfulideas.newzenler.com/login" \
            "https://meaningfulideas.newzenler.com/blog/i-wish-i-was-nicer" \
            "https://meaningfulideas.newzenler.com/blog/coercive-influence-decreases-over-time-relational-influence-increases-over-time" \
            "https://meaningfulideas.newzenler.com/blog/let-our-guidance-feel-good-to-our-children" \
            "https://meaningfulideas.ca"; do
            curl --fail --silent --show-error --location --head --max-time 30 "$url" >/dev/null
          done